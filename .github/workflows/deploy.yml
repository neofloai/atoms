name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Never run two deploys to the same environment at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# OIDC: GitHub mints a short-lived token to assume the AWS role.
# No long-lived AWS keys are stored in the repo.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, push to ECR, deploy App Runner
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tag with both the immutable commit SHA and a moving "latest" so
      # rollbacks can pin an exact build while App Runner tracks latest.
      - name: Compute image tags
        id: meta
        run: |
          registry="${{ steps.ecr.outputs.registry }}"
          repo="${{ env.ECR_REPOSITORY }}"
          echo "image_sha=${registry}/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${registry}/${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_latest }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Point App Runner at the freshly pushed SHA-tagged image and wait
      # for the rollout to reach a stable state.
      - name: Deploy to App Runner
        run: |
          aws apprunner update-service \
            --service-arn "${{ secrets.APPRUNNER_SERVICE_ARN }}" \
            --source-configuration "ImageRepository={ImageIdentifier=${{ steps.meta.outputs.image_sha }},ImageRepositoryType=ECR}"
          aws apprunner wait service-updated \
            --service-arn "${{ secrets.APPRUNNER_SERVICE_ARN }}"
