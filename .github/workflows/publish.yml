name: Publish

# Fires on version tags (v1.0.0, v1.2.3, ...). Push a tag to cut a release:
#   npm version 1.0.0 && git push --follow-tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish @neofloai/atoms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@neofloai'
          cache: npm

      # --ignore-scripts: this is a tarball publish, not a git-dependency
      # install, so the library gets built explicitly below rather than via
      # the `prepare` lifecycle script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build library
        run: npm run build:lib

      # This org's Actions policy caps GITHUB_TOKEN at read-only for
      # packages, so publishing uses a separately-scoped PAT instead
      # (classic token, write:packages scope) stored as a repo secret.
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
