name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded PR runs to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerate data/*.json and fail if the committed copies are stale.
      - name: Check generated data is up to date
        run: |
          npm run generate
          if ! git diff --quiet -- data; then
            echo "data/*.json is out of date. Run 'npm run generate' and commit the result."
            git diff --stat -- data
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build the consumable npm package (tsup -> dist/). This is what
      # downstream projects install via git+ssh, so a broken library build
      # must fail the PR.
      - name: Build library
        run: npm run build:lib

      - name: Build
        run: npm run build

  # PR-only: prove the production image builds. Pushing the image and
  # deploying to ECS is handled by AWS CodeBuild via buildspec.yml, so this
  # job never pushes -- it only catches Dockerfile breakage before merge.
  docker:
    name: Validate Docker build
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neoflo-atoms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
