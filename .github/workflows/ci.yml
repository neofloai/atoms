name: CI

# PR-only: deployment is handled by AWS CodePipeline on push to main, and
# branch protection runs these checks on the PR (strict mode keeps the PR up
# to date with main), so a separate push-to-main run would be redundant.
on:
  pull_request:

# Cancel superseded PR runs to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerate data/*.json and fail if the committed copies are stale.
      - name: Check generated data is up to date
        run: |
          npm run generate
          if ! git diff --quiet -- data; then
            echo "data/*.json is out of date. Run 'npm run generate' and commit the result."
            git diff --stat -- data
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build the consumable npm package (tsup -> dist/). This is what
      # downstream projects install straight from this repo, so a broken build
      # must fail the PR.
      - name: Build library
        run: npm run build:lib

      - name: Build
        run: npm run build

  # Prove the production image builds. Pushing the image and deploying to ECS
  # is handled by AWS CodeBuild via buildspec.yml, so this job never pushes --
  # it only catches Dockerfile breakage before merge.
  docker:
    name: Validate Docker build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neoflo-atoms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
