name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerate data/*.json and fail if the committed copies are stale.
      - name: Check generated data is up to date
        run: |
          npm run generate
          if ! git diff --quiet -- data; then
            echo "data/*.json is out of date. Run 'npm run generate' and commit the result."
            git diff --stat -- data
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Validate Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the image only (no push) so PRs catch Dockerfile breakage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neoflo-atoms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
